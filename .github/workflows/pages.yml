# Publishes a copy of the inspector to GitHub Pages - for forks and
# self-hosted copies (see docs/SELF-HOSTING.md). teia.cafe's own copy is
# deployed to Cloudflare instead, so this workflow skips the original repository.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository != 'teia-cafe/washing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Works out whether the site lives at /<repository>/ or at a custom domain's root.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_NAME: ${{ vars.VITE_SITE_NAME || github.repository_owner }}
          VITE_SOURCE_URL: ${{ vars.VITE_SOURCE_URL || format('{0}/{1}', github.server_url, github.repository) }}
          VITE_ACCESS_PASSWORD: ${{ vars.VITE_ACCESS_PASSWORD }}
          VITE_TZKT_API: ${{ vars.VITE_TZKT_API }}
          VITE_EXPLORER: ${{ vars.VITE_EXPLORER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
